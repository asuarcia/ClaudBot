; ─────────────────────────────────────────────────────────────────────────────
; Clock — the time, and nothing else.
;
; No bridge, no network: one time string on a frosted plate, drawn straight on
; the wallpaper.
;
; Two things to know about the layout:
;
;   * StringAlign=Center at X=0 does NOT centre the clock — it hangs half the
;     string off the left edge of the skin window, where it is clipped away,
;     so you see ":45" instead of "9:45". Centring is the window's job
;     (AnchorX/AnchorY=50% + WindowX/WindowY=50% in Rainmeter.ini), so the
;     string is aligned Left inside the window and the window auto-sizes.
;
;   * Rainmeter has no blur (the [Rainmeter] Blur option is Windows 7 Aero
;     only). The plate fakes one: concentric rounded rectangles, each a few
;     pixels larger and more transparent than the last, so its edge falls off
;     softly into the wallpaper instead of ending on a hard line.
;
; Right-click to switch between the four formats.
; ─────────────────────────────────────────────────────────────────────────────

[Rainmeter]
Update=1000
AccurateText=1
AlwaysOnTop=-2

ContextTitle=24-hour
ContextAction=[!WriteKeyValue Variables Fmt "%#H:%M"][!Refresh]
ContextTitle2=24-hour with seconds
ContextAction2=[!WriteKeyValue Variables Fmt "%#H:%M:%S"][!Refresh]
ContextTitle3=12-hour
ContextAction3=[!WriteKeyValue Variables Fmt "%#I:%M %p"][!Refresh]
ContextTitle4=12-hour with seconds
ContextAction4=[!WriteKeyValue Variables Fmt "%#I:%M:%S %p"][!Refresh]

[Metadata]
Name=Clock
Author=Claudbot
Information=A frosted desktop clock, centred on the desktop.
Version=1.1

[Variables]
Fmt=%#H:%M
Size=96
; 600 is semibold: heavier than the old Segoe UI Light, still not a slab.
Weight=600
Ink=255,255,255,242

; Plate geometry. Pad is how far the soft edge spreads beyond the plate, so it
; is also the offset every drawn thing needs from the window origin.
PadX=34
PadY=16
Pad=22
Radius=30

[mTime]
Measure=Time
Format=#Fmt#
DynamicVariables=1

; ─── the frosted plate ───────────────────────────────────────────────────────
; Drawn first so it sits behind the text. It reads [Time:W]/[Time:H] from the
; previous update — one tick behind on the very first frame, then exact.

[Plate]
Meter=Shape
X=0
Y=0
DynamicVariables=1
Shape=Rectangle (#Pad#-12),(#Pad#-12),([Time:W]+2*#PadX#+24),([Time:H]+2*#PadY#+24),(#Radius#+12) | Fill Color 10,12,18,16 | StrokeWidth 0
Shape2=Rectangle (#Pad#-8),(#Pad#-8),([Time:W]+2*#PadX#+16),([Time:H]+2*#PadY#+16),(#Radius#+8) | Fill Color 10,12,18,24 | StrokeWidth 0
Shape3=Rectangle (#Pad#-4),(#Pad#-4),([Time:W]+2*#PadX#+8),([Time:H]+2*#PadY#+8),(#Radius#+4) | Fill Color 10,12,18,34 | StrokeWidth 0
Shape4=Rectangle #Pad#,#Pad#,([Time:W]+2*#PadX#),([Time:H]+2*#PadY#),#Radius# | Fill Color 10,12,18,118 | StrokeWidth 1 | Stroke Color 255,255,255,28

; ─── the time ────────────────────────────────────────────────────────────────

[Time]
Meter=String
MeasureName=mTime
X=(#Pad#+#PadX#)
Y=(#Pad#+#PadY#)
DynamicVariables=1
FontFace=Segoe UI
FontWeight=#Weight#
FontSize=#Size#
FontColor=#Ink#
StringAlign=Left
AntiAlias=1
