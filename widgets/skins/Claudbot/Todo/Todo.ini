; ─────────────────────────────────────────────────────────────────────────────
; To-do — the organizer's task list, synced with Notion.
;
; Reads .claudbot/widgets/todo.txt. Line order:
;   1 header   2 notion state (on|off)
;   then six rows of: title, meta, urgency (overdue|today|normal|empty), id
;   27 updated
;
; Ordering matches the organizer's day spine: overdue first, then due today,
; then undated, then future. Clicking a circle completes the task through the
; organizer's API and pushes it to Notion.
;
; The task id travels in the file so the click handler can name the task it's
; completing — that's why each row carries a fourth, never-rendered field.
; ─────────────────────────────────────────────────────────────────────────────

[Rainmeter]
Update=1000
AccurateText=1
; Sit on the desktop layer, behind normal windows. Do NOT use !ZPos 1
; here — it pins the skin above everything, so it shows through the
; browser and every other app.
AlwaysOnTop=-2

[Metadata]
Name=Claudbot To-do
Author=Claudbot
Information=Your organizer tasks, two-way synced with Notion. Click a circle to complete.
Version=1.0

[Variables]
@Include=#@#common.inc
@Include2=#@#paths.inc
W=264
H=248

[MeasureTodo]
Measure=WebParser
URL=file://#DataDir#\todo.txt
CodePage=65001
ForceReload=1
UpdateRate=5
RegExp=(?siU)^(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n
OnConnectErrorAction=[!SetOption MeterHeader Text "bridge not running"]
OnRegExpErrorAction=[!SetOption MeterHeader Text "bridge not running"]

[MeasureHeader]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=1

[MeasureNotion]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=2
Substitute="on":"#Good#","off":"#Idle#"

; Three child measures per row off the same captures: the text, the ink colour,
; and the circle glyph. Splitting colour and glyph out of the urgency string is
; what lets an empty row render as nothing at all rather than a stray bullet.
[MeasureTitle1]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=3

[MeasureMeta1]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=4

[MeasureInk1]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=5
Substitute="overdue":"#Warn#","today":"#Ink#","normal":"#InkDim#","empty":"0,0,0,1"

[MeasureBox1]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=5
Substitute="empty":"","overdue":"○","today":"○","normal":"○"

[MeasureId1]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=6

[MeasureTitle2]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=7

[MeasureMeta2]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=8

[MeasureInk2]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=9
Substitute="overdue":"#Warn#","today":"#Ink#","normal":"#InkDim#","empty":"0,0,0,1"

[MeasureBox2]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=9
Substitute="empty":"","overdue":"○","today":"○","normal":"○"

[MeasureId2]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=10

[MeasureTitle3]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=11

[MeasureMeta3]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=12

[MeasureInk3]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=13
Substitute="overdue":"#Warn#","today":"#Ink#","normal":"#InkDim#","empty":"0,0,0,1"

[MeasureBox3]
