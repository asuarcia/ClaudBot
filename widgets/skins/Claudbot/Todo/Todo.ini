; ─── actions ─────────────────────────────────────────────────────────────────

[MeterDivider]
Meter=Shape
X=#Pad#
Y=200
Shape=Rectangle 0,0,(#W#-(#Pad#*2)),1 | Fill Color #Divider# | StrokeWidth 0

[StyleButton]
FontFace=#Face#
FontSize=#SizeSmall#
FontColor=#InkDim#
AntiAlias=1
SolidColor=255,255,255,10
Padding=8,5,8,5
MouseOverAction=[!SetOption "#CURRENTSECTION#" FontColor "#Ink#"][!SetOption "#CURRENTSECTION#" SolidColor "#Hover#"][!UpdateMeter "#CURRENTSECTION#"][!Redraw]
MouseLeaveAction=[!SetOption "#CURRENTSECTION#" FontColor "#InkDim#"][!SetOption "#CURRENTSECTION#" SolidColor "255,255,255,10"][!UpdateMeter "#CURRENTSECTION#"][!Redraw]

[MeterBtnAdd]
Meter=String
MeterStyle=StyleButton
X=#Pad#
Y=210
Text=+ task
LeftMouseUpAction=[!CommandMeasure MeasureTaskInput "ExecuteBatch 1"]

[MeterBtnSync]
Meter=String
MeterStyle=StyleButton
X=5R
Y=0r
Text=sync
LeftMouseUpAction=["#NodeExe#" "#Bridge#" "action" "notion-sync"]
ToolTipText=Push and pull tasks with Notion now

[MeterBtnNotion]
Meter=String
MeterStyle=StyleButton
X=5R
Y=0r
Text=notion
LeftMouseUpAction=["#NodeExe#" "#Bridge#" "action" "open-notion"]
ToolTipText=Open the tasks database in your browser

[MeterUpdated]
