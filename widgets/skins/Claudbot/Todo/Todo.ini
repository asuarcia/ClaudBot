[MeasureTaskInput]
Measure=Plugin
Plugin=InputText
SolidColor=24,26,32,255
FontColor=#Ink#
FontFace=#Face#
FontSize=10
W=230
H=26
X=14
Y=210
StringAlign=Left
FocusDismiss=1
Command1=["#NodeExe#" "#Bridge#" "action" "task-add" "$UserInput$"]

; ─── card ────────────────────────────────────────────────────────────────────

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,#W#,#H#,#Radius# | Fill Color #Card# | StrokeWidth 1 | Stroke Color #CardEdge#

[MeterAccentBar]
Meter=Shape
X=#Pad#
Y=16
Shape=Rectangle 0,0,3,13,1.5 | Fill Color #Accent# | StrokeWidth 0

[MeterTitle]
Meter=String
X=9r
Y=-2r
FontFace=#Face#
FontSize=#SizeTitle#
FontColor=#Ink#
StringStyle=Bold
StringCase=Upper
AntiAlias=1
Text=Tasks

[MeterNotionDot]
Meter=Shape
X=(#W#-#Pad#-46)
Y=21
DynamicVariables=1
Shape=Ellipse 3,3,3 | Fill Color [MeasureNotion] | StrokeWidth 0
ToolTipText=Notion sync status

[MeterHeader]
Meter=String
X=(#W#-#Pad#)
Y=17
StringAlign=Right
FontFace=#Face#
FontSize=#SizeSmall#
FontColor=#InkDim#
AntiAlias=1
MeasureName=MeasureHeader
Text=%1

; ─── rows ────────────────────────────────────────────────────────────────────
; Circle, title, right-aligned meta. 26px apart. Clicking the circle completes
; the task; clicking the title does nothing, so a misfire can't lose work.

[StyleBox]
X=(#Pad#+1)
FontFace=#Face#
FontSize=11
DynamicVariables=1
AntiAlias=1
W=18
H=20
SolidColor=0,0,0,1

[StyleTitle]
X=(#Pad#+20)
FontFace=#Face#
FontSize=#SizeBody#
DynamicVariables=1
AntiAlias=1
ClipString=1
W=160
H=18

[StyleMeta]
X=(#W#-#Pad#)
StringAlign=Right
FontFace=#Face#
FontSize=#SizeSmall#
FontColor=#InkFaint#
AntiAlias=1

[MeterBox1]
Meter=String
MeterStyle=StyleBox
Y=44
FontColor=[MeasureInk1]
MeasureName=MeasureBox1
Text=%1
LeftMouseUpAction=["#NodeExe#" "#Bridge#" "action" "task-done" "[MeasureId1]"]
ToolTipText=Click to complete

