URL=[MeasureTodo]
StringIndex=13
Substitute="empty":"","overdue":"○","today":"○","normal":"○"

[MeasureId3]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=14

[MeasureTitle4]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=15

[MeasureMeta4]
Measure=WebParser
URL=[MeasureTodo]
StringIndex=16

[MeasureInk4]
