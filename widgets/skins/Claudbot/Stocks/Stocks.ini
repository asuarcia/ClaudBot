; ─────────────────────────────────────────────────────────────────────────────
; Stocks — a three-symbol watchlist.
;
; Reads .claudbot/widgets/stocks.txt. Line order:
;   1 market state (live|closed|nokey|error)   2 market label
;   3-6    symbol, price, change, direction    (row 1)
;   7-10   symbol, price, change, direction    (row 2)
;   11-14  symbol, price, change, direction    (row 3)
;   15 updated
;
; The bridge holds the Finnhub key and does the fetching — nothing here touches
; the network, so the key never lands in a plaintext .ini inside Documents\.
;
; Right-click a row to change its symbol.
; ─────────────────────────────────────────────────────────────────────────────

[Rainmeter]
Update=1000
AccurateText=1
; Sit on the desktop layer, behind normal windows. Do NOT use !ZPos 1
; here — it pins the skin above everything, so it shows through the
; browser and every other app.
AlwaysOnTop=-2

[Metadata]
Name=Claudbot Stocks
Author=Claudbot
Information=Three-symbol watchlist via Finnhub. Right-click a row to change the symbol.
Version=1.0

[Variables]
@Include=#@#common.inc
@Include2=#@#paths.inc
W=244
H=158

[MeasureStocks]
Measure=WebParser
URL=file://#DataDir#\stocks.txt
CodePage=65001
ForceReload=1
UpdateRate=5
RegExp=(?siU)^(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n
OnConnectErrorAction=[!SetOption MeterMarket Text "bridge not running"]
OnRegExpErrorAction=[!SetOption MeterMarket Text "bridge not running"]

; Market state drives the dot colour. "closed" is grey rather than red because
; a closed market isn't a fault — showing it as one would train you to ignore it.
[MeasureMarketState]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=1
Substitute="live":"#Good#","closed":"#Idle#","nokey":"#Warn#","error":"#Bad#"

[MeasureMarketLabel]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=2

[MeasureSym1]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=3

[MeasurePrice1]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=4

[MeasureChange1]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=5

[MeasureDir1]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=6
Substitute="up":"#Good#","down":"#Bad#","flat":"#InkDim#"

[MeasureSym2]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=7

[MeasurePrice2]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=8

[MeasureChange2]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=9

[MeasureDir2]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=10
Substitute="up":"#Good#","down":"#Bad#","flat":"#InkDim#"

[MeasureSym3]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=11

[MeasurePrice3]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=12

[MeasureChange3]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=13

[MeasureDir3]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=14
Substitute="up":"#Good#","down":"#Bad#","flat":"#InkDim#"

[MeasureUpdated]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=15

; ─── symbol entry ────────────────────────────────────────────────────────────

[MeasureSymbolInput]
Measure=Plugin
Plugin=InputText
SolidColor=24,26,32,255
FontColor=#Ink#
FontFace=#Face#
FontSize=10
W=90
H=24
X=14
StringAlign=Left
FocusDismiss=1
DynamicVariables=1
Command1=["#NodeExe#" "#Bridge#" "action" "watchlist-set" "1" "$UserInput$"]
Command2=["#NodeExe#" "#Bridge#" "action" "watchlist-set" "2" "$UserInput$"]
Command3=["#NodeExe#" "#Bridge#" "action" "watchlist-set" "3" "$UserInput$"]

; ─── card ────────────────────────────────────────────────────────────────────

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,#W#,#H#,#Radius# | Fill Color #Card# | StrokeWidth 1 | Stroke Color #CardEdge#

[MeterAccentBar]
Meter=Shape
X=#Pad#
Y=16
Shape=Rectangle 0,0,3,13,1.5 | Fill Color #Accent# | StrokeWidth 0

[MeterTitle]
Meter=String
X=9r
Y=-2r
FontFace=#Face#
FontSize=#SizeTitle#
FontColor=#Ink#
StringStyle=Bold
StringCase=Upper
AntiAlias=1
Text=Watchlist

[MeterMarketDot]
Meter=Shape
X=(#W#-#Pad#-64)
Y=21
DynamicVariables=1
Shape=Ellipse 3,3,3 | Fill Color [MeasureMarketState] | StrokeWidth 0

[MeterMarket]
Meter=String
X=(#W#-#Pad#)
Y=17
StringAlign=Right
FontFace=#Face#
FontSize=#SizeSmall#
FontColor=#InkDim#
AntiAlias=1
MeasureName=MeasureMarketLabel
Text=%1

; ─── rows ────────────────────────────────────────────────────────────────────
; Symbol left, price right, change under the price in the direction colour.
; 34px apart, with a hairline between.

[StyleSym]
X=#Pad#
FontFace=#Face#
FontSize=#SizeBody#
FontColor=#Ink#
StringStyle=Bold
AntiAlias=1

[StylePrice]
X=(#W#-#Pad#)
StringAlign=Right
FontFace=#FaceNum#
FontSize=11
FontColor=#Ink#
AntiAlias=1

[StyleChange]
X=(#W#-#Pad#)
StringAlign=Right
FontFace=#FaceNum#
FontSize=#SizeSmall#
DynamicVariables=1
AntiAlias=1

; A transparent hit area over the whole row so right-click works anywhere on it,
; not just on the text.
[StyleRowHit]
X=0
W=#W#
H=32
SolidColor=0,0,0,1

[MeterRow1Hit]
Meter=Image
MeterStyle=StyleRowHit
Y=46
RightMouseUpAction=[!SetOption MeasureSymbolInput Y "44"][!SetOption MeasureSymbolInput DefaultValue "[MeasureSym1]"][!CommandMeasure MeasureSymbolInput "ExecuteBatch 1"]
DynamicVariables=1
ToolTipText=Right-click to change this symbol

[MeterSym1]
Meter=String
MeterStyle=StyleSym
Y=52
MeasureName=MeasureSym1
Text=%1

[MeterPrice1]
Meter=String
MeterStyle=StylePrice
Y=46
MeasureName=MeasurePrice1
Text=%1

[MeterChange1]
Meter=String
MeterStyle=StyleChange
Y=66
FontColor=[MeasureDir1]
MeasureName=MeasureChange1
Text=%1

[MeterRule1]
Meter=Shape
X=#Pad#
Y=80
Shape=Rectangle 0,0,(#W#-(#Pad#*2)),1 | Fill Color #Divider# | StrokeWidth 0

[MeterRow2Hit]
Meter=Image
MeterStyle=StyleRowHit
Y=80
RightMouseUpAction=[!SetOption MeasureSymbolInput Y "78"][!SetOption MeasureSymbolInput DefaultValue "[MeasureSym2]"][!CommandMeasure MeasureSymbolInput "ExecuteBatch 2"]
DynamicVariables=1
ToolTipText=Right-click to change this symbol

[MeterSym2]
Meter=String
MeterStyle=StyleSym
Y=86
MeasureName=MeasureSym2
Text=%1

[MeterPrice2]
Meter=String
MeterStyle=StylePrice
Y=80
MeasureName=MeasurePrice2
Text=%1

[MeterChange2]
Meter=String
MeterStyle=StyleChange
Y=100
FontColor=[MeasureDir2]
MeasureName=MeasureChange2
Text=%1

[MeterRule2]
Meter=Shape
X=#Pad#
Y=114
Shape=Rectangle 0,0,(#W#-(#Pad#*2)),1 | Fill Color #Divider# | StrokeWidth 0

[MeterRow3Hit]
Meter=Image
MeterStyle=StyleRowHit
Y=114
RightMouseUpAction=[!SetOption MeasureSymbolInput Y "112"][!SetOption MeasureSymbolInput DefaultValue "[MeasureSym3]"][!CommandMeasure MeasureSymbolInput "ExecuteBatch 3"]
DynamicVariables=1
ToolTipText=Right-click to change this symbol

[MeterSym3]
Meter=String
MeterStyle=StyleSym
Y=120
MeasureName=MeasureSym3
Text=%1

[MeterPrice3]
Meter=String
MeterStyle=StylePrice
Y=114
MeasureName=MeasurePrice3
Text=%1

[MeterChange3]
Meter=String
MeterStyle=StyleChange
Y=134
FontColor=[MeasureDir3]
MeasureName=MeasureChange3
Text=%1
