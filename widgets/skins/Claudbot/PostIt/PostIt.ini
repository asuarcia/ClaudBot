; ─────────────────────────────────────────────────────────────────────────────
; Post-it — a real sticky note on the desktop.
;
; The only widget with no dependency on the bridge, on Claudbot, or on the
; network. Notes live in this file's own [Variables] via !WriteKeyValue, so the
; note survives reboots and keeps working even with everything else shut down.
;
; Click a line to edit it (InputText, bundled with Rainmeter — no install).
; Right-click for the colour menu and to clear the note.
;
; The paper is drawn, not an image: a two-stop gradient for the slight sheen
; real paper has, three stacked translucent rectangles standing in for a blurred
; drop shadow (Rainmeter shapes have no blur), and a folded corner made of two
; triangles — a dark one for the shadow under the fold and a light one for the
; lifted flap.
; ─────────────────────────────────────────────────────────────────────────────

[Rainmeter]
Update=1000
AccurateText=1
; Sit on the desktop layer, behind normal windows. Do NOT use !ZPos 1
; here — it pins the skin above everything, so it shows through the
; browser and every other app.
AlwaysOnTop=-2

ContextTitle=Classic yellow
ContextAction=[!WriteKeyValue Variables PaperTop "255,243,163"][!WriteKeyValue Variables PaperBot "250,226,112"][!WriteKeyValue Variables PaperEdge "232,206,96"][!WriteKeyValue Variables NoteInk "78,66,30"][!WriteKeyValue Variables RuleInk "203,180,92"][!Refresh]

ContextTitle2=Pink
ContextAction2=[!WriteKeyValue Variables PaperTop "255,196,214"][!WriteKeyValue Variables PaperBot "252,168,194"][!WriteKeyValue Variables PaperEdge "232,148,175"][!WriteKeyValue Variables NoteInk "94,38,58"][!WriteKeyValue Variables RuleInk "222,140,168"][!Refresh]

ContextTitle3=Blue
ContextAction3=[!WriteKeyValue Variables PaperTop "186,224,255"][!WriteKeyValue Variables PaperBot "150,203,247"][!WriteKeyValue Variables PaperEdge "132,184,228"][!WriteKeyValue Variables NoteInk "26,58,88"][!WriteKeyValue Variables RuleInk "126,176,218"][!Refresh]

ContextTitle4=Green
ContextAction4=[!WriteKeyValue Variables PaperTop "198,240,186"][!WriteKeyValue Variables PaperBot "165,222,152"][!WriteKeyValue Variables PaperEdge "145,201,133"][!WriteKeyValue Variables NoteInk "34,72,34"][!WriteKeyValue Variables RuleInk "140,196,130"][!Refresh]

ContextTitle5=Orange
ContextAction5=[!WriteKeyValue Variables PaperTop "255,214,163"][!WriteKeyValue Variables PaperBot "252,188,116"][!WriteKeyValue Variables PaperEdge "230,168,100"][!WriteKeyValue Variables NoteInk "92,50,14"][!WriteKeyValue Variables RuleInk "222,168,110"][!Refresh]

ContextTitle6=-
ContextAction6=[]

ContextTitle7=Clear the note
ContextAction7=[!WriteKeyValue Variables Line1 ""][!WriteKeyValue Variables Line2 ""][!WriteKeyValue Variables Line3 ""][!WriteKeyValue Variables Line4 ""][!WriteKeyValue Variables Line5 ""][!Refresh]

[Metadata]
Name=Claudbot Post-it
Author=Claudbot
Information=A sticky note you can type on. Click a line to edit, right-click to change colour.
Version=1.0

[Variables]
W=216
H=216

; Paper colour. Rewritten in place by the right-click menu, which is why these
; are literal RGB values rather than a named scheme — !WriteKeyValue can only
; write a literal, and resolving a name back to a colour would need nested
; variable lookups that break as soon as anything is misspelt.
PaperTop=255,243,163
PaperBot=250,226,112
PaperEdge=232,206,96
NoteInk=78,66,30
RuleInk=203,180,92

; The note itself.
Line1=
Line2=
Line3=
Line4=
Line5=

; ─── editing ─────────────────────────────────────────────────────────────────

; One command per line. The click handler positions the input box over the line
; being edited and seeds it with the current text, so editing feels in-place
; even though InputText is really a separate floating window.
[MeasureInput]
Measure=Plugin
Plugin=InputText
SolidColor=255,255,255,235
FontColor=#NoteInk#
FontFace=Segoe Print
FontSize=10
W=176
H=24
X=20
Y=60
StringAlign=Left
FocusDismiss=1
DynamicVariables=1
Command1=[!WriteKeyValue Variables Line1 "$UserInput$"][!Refresh]
Command2=[!WriteKeyValue Variables Line2 "$UserInput$"][!Refresh]
Command3=[!WriteKeyValue Variables Line3 "$UserInput$"][!Refresh]
Command4=[!WriteKeyValue Variables Line4 "$UserInput$"][!Refresh]
Command5=[!WriteKeyValue Variables Line5 "$UserInput$"][!Refresh]

; ─── paper ───────────────────────────────────────────────────────────────────

; Three offset rectangles at decreasing alpha. Not a real blur, but at these
; sizes the eye reads it as one soft shadow and it costs nothing.
[MeterShadow]
Meter=Shape
X=0
Y=0
Shape=Rectangle 7,9,#W#,#H#,2 | Fill Color 0,0,0,26 | StrokeWidth 0
Shape2=Rectangle 5,6,#W#,#H#,2 | Fill Color 0,0,0,26 | StrokeWidth 0
Shape3=Rectangle 3,4,#W#,#H#,2 | Fill Color 0,0,0,26 | StrokeWidth 0

; Square corners on purpose — a rounded sticky note reads as a UI card, and the
; whole point of this one is that it doesn't.
; The gradient has to be defined here in the meter section — Rainmeter won't
; accept one passed in through a variable. It also can't live in [Variables]
; regardless, because ";" opens a comment in an ini and would eat the stops.
[MeterPaper]
Meter=Shape
X=0
Y=0
DynamicVariables=1
PaperGradient=90 | #PaperTop#,255 ; 0.0 | #PaperBot#,255 ; 1.0
Shape=Rectangle 0,0,#W#,#H#,1 | Fill LinearGradient PaperGradient | StrokeWidth 1 | Stroke Color #PaperEdge#,140

; Ruled lines, barely there.
[MeterRules]
Meter=Shape
X=0
Y=0
DynamicVariables=1
Shape=Rectangle 20,76,176,1 | Fill Color #RuleInk#,90 | StrokeWidth 0
Shape2=Rectangle 20,104,176,1 | Fill Color #RuleInk#,90 | StrokeWidth 0
Shape3=Rectangle 20,132,176,1 | Fill Color #RuleInk#,90 | StrokeWidth 0
Shape4=Rectangle 20,160,176,1 | Fill Color #RuleInk#,90 | StrokeWidth 0
Shape5=Rectangle 20,188,176,1 | Fill Color #RuleInk#,90 | StrokeWidth 0

; The folded bottom-right corner: a shadow triangle under the fold, then the
; lifted flap on top catching light.
; Two things Rainmeter requires of a Path, both learned the hard way:
;   - Only the first point is a bare pair; every later segment needs an explicit
;     command (LineTo). A bare pair is rejected as "Invalid Path type", where
;     "type" means the segment command, not the coordinates.
;   - Points must be literal numbers. Formulas like (#W#-30) are not evaluated
;     here, so these are hardcoded against W=H=216 — change them together.
[MeterCurl]
Meter=Shape
X=0
Y=0
DynamicVariables=1
FoldShadow=186,216 | LineTo 216,186 | LineTo 216,216 | ClosePath 1
FoldFlap=190,216 | LineTo 216,190 | LineTo 190,190 | ClosePath 1
Shape=Path FoldShadow | Fill Color 0,0,0,55 | StrokeWidth 0
Shape2=Path FoldFlap | Fill Color 255,255,255,120 | StrokeWidth 1 | Stroke Color #PaperEdge#,160

; ─── text ────────────────────────────────────────────────────────────────────

[MeterHeader]
Meter=String
X=20
Y=24
FontFace=Segoe Print
FontSize=9
FontColor=#NoteInk#,120
DynamicVariables=1
AntiAlias=1
Text=remember

[StyleLine]
X=20
FontFace=Segoe Print
FontSize=10
FontColor=#NoteInk#
DynamicVariables=1
AntiAlias=1
ClipString=1
W=176
H=22
; A transparent solid colour still takes mouse clicks, which is what makes the
; whole line clickable rather than just the glyphs.
SolidColor=0,0,0,1

[MeterLine1]
Meter=String
MeterStyle=StyleLine
Y=54
Text=#Line1#
LeftMouseUpAction=[!SetOption MeasureInput Y "52"][!SetOption MeasureInput DefaultValue "#Line1#"][!CommandMeasure MeasureInput "ExecuteBatch 1"]
ToolTipText=Click to edit

[MeterLine2]
Meter=String
MeterStyle=StyleLine
Y=82
Text=#Line2#
LeftMouseUpAction=[!SetOption MeasureInput Y "80"][!SetOption MeasureInput DefaultValue "#Line2#"][!CommandMeasure MeasureInput "ExecuteBatch 2"]
ToolTipText=Click to edit

[MeterLine3]
Meter=String
MeterStyle=StyleLine
Y=110
Text=#Line3#
LeftMouseUpAction=[!SetOption MeasureInput Y "108"][!SetOption MeasureInput DefaultValue "#Line3#"][!CommandMeasure MeasureInput "ExecuteBatch 3"]
ToolTipText=Click to edit

[MeterLine4]
Meter=String
MeterStyle=StyleLine
Y=138
Text=#Line4#
LeftMouseUpAction=[!SetOption MeasureInput Y "136"][!SetOption MeasureInput DefaultValue "#Line4#"][!CommandMeasure MeasureInput "ExecuteBatch 4"]
ToolTipText=Click to edit

[MeterLine5]
Meter=String
MeterStyle=StyleLine
Y=166
Text=#Line5#
LeftMouseUpAction=[!SetOption MeasureInput Y "164"][!SetOption MeasureInput DefaultValue "#Line5#"][!CommandMeasure MeasureInput "ExecuteBatch 5"]
ToolTipText=Click to edit
