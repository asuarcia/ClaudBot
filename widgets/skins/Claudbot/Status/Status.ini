; ─────────────────────────────────────────────────────────────────────────────
; Claudbot — status and launcher.
;
; Reads .claudbot/widgets/status.txt, written by widgets/bridge.mjs. That file
; is one value per line in a fixed order; the single RegExp below captures all
; 13 in one pass and the child measures pick them off by StringIndex:
;
;   1 organizer state   2 organizer detail
;   3 briefing state    4 briefing detail
;   5 dream state       6 dream detail
;   7 screen state      8 screen detail
;   9 usage calls      10 usage tokens    11 usage cost
;  12 usage detail     13 updated
;
; "state" is up|down|idle and is substituted straight into a colour, which is
; why the status dots need DynamicVariables.
; ─────────────────────────────────────────────────────────────────────────────

[Rainmeter]
Update=1000
AccurateText=1
; Sit on the desktop layer, behind normal windows. Do NOT use !ZPos 1
; here — it pins the skin above everything, so it shows through the
; browser and every other app.
AlwaysOnTop=-2

[Metadata]
Name=Claudbot Status
Author=Claudbot
Information=Claudbot service status, today's agent usage, and one-click launchers.
Version=1.0

[Variables]
@Include=#@#common.inc
@Include2=#@#paths.inc
W=264
H=286

; ─── data ────────────────────────────────────────────────────────────────────

[MeasureStatus]
Measure=WebParser
URL=file://#DataDir#\status.txt
CodePage=65001
ForceReload=1
UpdateRate=5
RegExp=(?siU)^(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n(.*)\n
; The file is written atomically by the bridge, so a failed read means it isn't
; there yet — not that it's corrupt. Say so instead of showing a blank card.
OnConnectErrorAction=[!SetOption MeterTitleNote Text "bridge not running"]
OnRegExpErrorAction=[!SetOption MeterTitleNote Text "bridge not running"]
FinishAction=[!SetOption MeterTitleNote Text ""]

; State strings mapped to colours. Each is its own measure because Substitute
; runs per measure, and the dots need real RGB values not the word "up".
[MeasureOrgState]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=1
Substitute="up":"#Good#","down":"#Bad#","idle":"#Idle#"

[MeasureOrgDetail]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=2

[MeasureBriefState]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=3
Substitute="up":"#Good#","down":"#Bad#","idle":"#Idle#"

[MeasureBriefDetail]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=4

[MeasureDreamState]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=5
Substitute="up":"#Good#","down":"#Bad#","idle":"#Idle#"

[MeasureDreamDetail]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=6

[MeasureScreenState]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=7
Substitute="up":"#Good#","down":"#Bad#","idle":"#Idle#"

[MeasureScreenDetail]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=8

[MeasureCalls]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=9

[MeasureTokens]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=10

[MeasureCost]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=11

[MeasureUsageDetail]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=12

[MeasureUpdated]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=13

; ─── card ────────────────────────────────────────────────────────────────────

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,#W#,#H#,#Radius# | Fill Color #Card# | StrokeWidth 1 | Stroke Color #CardEdge#

; The one piece of colour in the header. Reads as a brand mark rather than
; decoration because nothing else on the card is this hue.
[MeterAccentBar]
Meter=Shape
X=#Pad#
Y=16
Shape=Rectangle 0,0,3,13,1.5 | Fill Color #Accent# | StrokeWidth 0

[MeterTitle]
Meter=String
X=9r
Y=-2r
FontFace=#Face#
FontSize=#SizeTitle#
FontColor=#Ink#
StringStyle=Bold
StringCase=Upper
AntiAlias=1
Text=Claudbot
LeftMouseUpAction=["#NodeExe#" "#Bridge#" "action" "open-organizer"]
ToolTipText=Open the organizer in your browser

[MeterTitleNote]
Meter=String
X=(#W#-#Pad#)
Y=17
StringAlign=Right
FontFace=#Face#
FontSize=#SizeSmall#
FontColor=#Warn#
AntiAlias=1
Text=

; ─── status rows ─────────────────────────────────────────────────────────────
; Four identical rows 20px apart. Each is dot + label + right-aligned detail.

[MeterDotOrg]
Meter=Shape
X=(#Pad#+1)
Y=48
DynamicVariables=1
Shape=Ellipse 3,3,3 | Fill Color [MeasureOrgState] | StrokeWidth 0

[MeterLabelOrg]
Meter=String
X=(#Pad#+16)
Y=42
FontFace=#Face#
FontSize=#SizeBody#
FontColor=#Ink#
AntiAlias=1
Text=organizer

[MeterDetailOrg]
Meter=String
X=(#W#-#Pad#)
Y=42
StringAlign=Right
FontFace=#Face#
FontSize=#SizeBody#
FontColor=#InkDim#
AntiAlias=1
MeasureName=MeasureOrgDetail
Text=%1

[MeterDotBrief]
Meter=Shape
X=(#Pad#+1)
Y=68
DynamicVariables=1
Shape=Ellipse 3,3,3 | Fill Color [MeasureBriefState] | StrokeWidth 0

[MeterLabelBrief]
Meter=String
X=(#Pad#+16)
Y=62
FontFace=#Face#
FontSize=#SizeBody#
FontColor=#Ink#
AntiAlias=1
Text=briefing

[MeterDetailBrief]
Meter=String
X=(#W#-#Pad#)
Y=62
StringAlign=Right
FontFace=#Face#
FontSize=#SizeBody#
FontColor=#InkDim#
AntiAlias=1
MeasureName=MeasureBriefDetail
Text=%1

[MeterDotDream]
Meter=Shape
X=(#Pad#+1)
Y=88
DynamicVariables=1
Shape=Ellipse 3,3,3 | Fill Color [MeasureDreamState] | StrokeWidth 0

[MeterLabelDream]
Meter=String
X=(#Pad#+16)
Y=82
FontFace=#Face#
FontSize=#SizeBody#
FontColor=#Ink#
AntiAlias=1
Text=dream

[MeterDetailDream]
Meter=String
X=(#W#-#Pad#)
Y=82
StringAlign=Right
FontFace=#Face#
FontSize=#SizeBody#
FontColor=#InkDim#
AntiAlias=1
MeasureName=MeasureDreamDetail
Text=%1

[MeterDotScreen]
Meter=Shape
X=(#Pad#+1)
Y=108
DynamicVariables=1
Shape=Ellipse 3,3,3 | Fill Color [MeasureScreenState] | StrokeWidth 0

[MeterLabelScreen]
Meter=String
X=(#Pad#+16)
Y=102
FontFace=#Face#
FontSize=#SizeBody#
FontColor=#Ink#
AntiAlias=1
Text=screen

[MeterDetailScreen]
Meter=String
X=(#W#-#Pad#)
Y=102
StringAlign=Right
FontFace=#Face#
FontSize=#SizeBody#
FontColor=#InkDim#
AntiAlias=1
MeasureName=MeasureScreenDetail
Text=%1

; ─── usage ───────────────────────────────────────────────────────────────────

[MeterDivider1]
Meter=Shape
X=#Pad#
Y=128
Shape=Rectangle 0,0,(#W#-(#Pad#*2)),1 | Fill Color #Divider# | StrokeWidth 0

[MeterUsageHead]
Meter=String
X=#Pad#
Y=138
FontFace=#Face#
FontSize=#SizeSmall#
FontColor=#InkFaint#
StringCase=Upper
AntiAlias=1
Text=Agent usage today

; Three figures across the card. Numbers in a mono face so they don't jitter
; as they change width.
[MeterCalls]
Meter=String
X=#Pad#
Y=152
FontFace=#FaceNum#
FontSize=#SizeBig#
FontColor=#Ink#
AntiAlias=1
MeasureName=MeasureCalls
Text=%1

[MeterCallsLabel]
Meter=String
X=#Pad#
Y=174
FontFace=#Face#
FontSize=#SizeSmall#
FontColor=#InkFaint#
AntiAlias=1
Text=calls

[MeterTokens]
Meter=String
X=(#W#/2)
Y=152
StringAlign=Center
FontFace=#FaceNum#
FontSize=#SizeBig#
FontColor=#Ink#
AntiAlias=1
MeasureName=MeasureTokens
Text=%1

[MeterTokensLabel]
Meter=String
X=(#W#/2)
Y=174
StringAlign=Center
FontFace=#Face#
FontSize=#SizeSmall#
FontColor=#InkFaint#
AntiAlias=1
Text=tokens

[MeterCost]
