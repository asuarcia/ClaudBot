X=#Pad#
Y=190
FontFace=#Face#
FontSize=#SizeSmall#
FontColor=#InkDim#
AntiAlias=1
MeasureName=MeasureUsageDetail
Text=%1
ToolTipText=Calls per agent today. Set CLAUDBOT_USAGE_RATE_PER_MTOK in .env to see a cost figure.

; ─── launcher ────────────────────────────────────────────────────────────────

[MeterDivider2]
Meter=Shape
X=#Pad#
Y=210
Shape=Rectangle 0,0,(#W#-(#Pad#*2)),1 | Fill Color #Divider# | StrokeWidth 0

; Four buttons per row. Each opens a new terminal running the subcommand —
; going through node + the script path rather than a `claudbot` on PATH so this
; works regardless of how the CLI was installed.
[StyleButton]
FontFace=#Face#
FontSize=#SizeSmall#
FontColor=#InkDim#
AntiAlias=1
SolidColor=255,255,255,10
Padding=8,5,8,5
MouseOverAction=[!SetOption "#CURRENTSECTION#" FontColor "#Ink#"][!SetOption "#CURRENTSECTION#" SolidColor "#Hover#"][!UpdateMeter "#CURRENTSECTION#"][!Redraw]
MouseLeaveAction=[!SetOption "#CURRENTSECTION#" FontColor "#InkDim#"][!SetOption "#CURRENTSECTION#" SolidColor "255,255,255,10"][!UpdateMeter "#CURRENTSECTION#"][!Redraw]

[MeterBtnStart]
Meter=String
MeterStyle=StyleButton
X=#Pad#
Y=222
Text=start
LeftMouseUpAction=["cmd.exe" "/c" "start" "cmd" "/k" "#NodeExe#" "#Claudbot#" "start"]

[MeterBtnOrganizer]
Meter=String
MeterStyle=StyleButton
X=5R
Y=0r
Text=organizer
