# Claudbot Agent Registry
# ------------------------------------------------------------------
# Define sub-agents here. Claude will read this to decide who to
# delegate to. Add an agent by filling in the four fields below.
#
# Fields:
#   name        - short identifier, used when calling run_agent()
#   model       - model ID as the endpoint expects it
#   endpoint    - base URL of any OpenAI-compatible API
#   apiKeyEnv   - env var holding the API key (null for local endpoints)
#   jobDescription - what this agent is good at (guides Claude's routing)
#   fallback    - optional: agent to retry on once if this one fails (one hop)
#
# Models verified against the live build.nvidia.com/models catalog by calling
# each one (2026-08-15). All run on the NVIDIA NIM OpenAI-compatible endpoint.
#
# Re-verify after any long gap. On 2026-08-15 three of seven agents were dead
# and every delegation to them failed: NVIDIA retired both DeepSeek V4 models on
# 2026-08-07 (HTTP 410 "reached its end of life"), and Google cut Gemini CLI off
# for individual accounts. A registry entry that 404s is worse than a missing
# one — it costs a call and a retry before anything else can be tried.
# ------------------------------------------------------------------

agents:
  - name: coder
    # Was deepseek-v4-pro until NVIDIA retired it (410) on 2026-08-07. This dated
    # pin of V4 Flash is the strongest DeepSeek still served, and at ~2.5s for a
    # short answer it is by far the fastest of the live coding-capable models —
    # glm-5.2 and gpt-oss-120b both answered the same prompt but took 38s and
    # 81s, which is too slow to sit behind an interactive delegation.
    model: deepseek-ai/deepseek-v4-flash-0731
    endpoint: https://integrate.api.nvidia.com/v1
    apiKeyEnv: NIM_API_KEY
    jobDescription: >
      Writing, reviewing, refactoring, and debugging code (DeepSeek V4 Flash —
      the strongest coding model still served on this account). Best for:
      implementing features, fixing bugs, non-trivial refactors, code review,
      and technical problem solving. Give it the full code/context it needs — it
      has no prior conversation history.

  # Forge's CAD generator. Same model as `coder`, on purpose and on evidence:
  # benchmarked 2026-08-15 by sending the real build123d system prompt to five
  # candidates and building whatever came back. Only this one produced a part
  # that compiled — nemotron-nano invented `drill_hole`, nemotron-super
  # hallucinated `BuildPart.fillet`, glm-5.2 invented `regular_polygon`, and
  # minimax-m3 used a 2D `Rectangle` in a 3D context. It was also the cheapest
  # by a wide margin: 352 completion tokens against 3145 and 4096 for the two
  # reasoning models, which spent all of it thinking and still failed.
  #
  # It exists as its own entry rather than reusing `coder` so CAD spend is
  # metered separately in .claudbot/usage.json (and so on the Status widget),
  # and so it can be repointed without touching general code work. The actual
  # specialisation is the system prompt in forge/src/prompts.mjs, which Forge
  # passes explicitly — this jobDescription is never sent.
  - name: cad
    model: deepseek-ai/deepseek-v4-flash-0731
    endpoint: https://integrate.api.nvidia.com/v1
    apiKeyEnv: NIM_API_KEY
    maxTokens: 4096
    jobDescription: >
      Writes parametric CAD — build123d (Python) and OpenSCAD — for Forge's
      `claudbot forge make`. Not for general use: Forge supplies its own system
      prompt carrying the modelling rules and the printer's constraints, and
      calls this agent through FORGE_AGENT. Reasoning models do badly at this
      and cost an order of magnitude more, so keep it pointed at a fast
      instruct model.

  - name: researcher
    model: nvidia/nemotron-3-ultra-550b-a55b
    endpoint: https://integrate.api.nvidia.com/v1
    apiKeyEnv: NIM_API_KEY
    jobDescription: >
      Deep reasoning, planning and summarization (Nemotron 3 Ultra, 550B MoE).
      Best for: multi-step reasoning, architecture and project planning,
      trade-off analysis. Returns well-structured markdown. Two warnings: it has
      no web access, so live-web research belongs in Claude's own WebSearch, not
      here; and on large prompts it regularly exceeds the MCP request cap, so do
      not route latency-sensitive work to it.

  - name: fast
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    endpoint: https://integrate.api.nvidia.com/v1
    apiKeyEnv: NIM_API_KEY
    jobDescription: >
      Fast, cheap, high-volume tasks (Nemotron 3 Nano, 30B-a3b). Best for:
      quick summaries, classification, extraction, reformatting, drafting
      short text, simple lookups, and anything where speed and low cost matter
      more than maximum depth. Use this instead of researcher when the task is
      light.

  - name: agent
    # kimi-k2.6 went 404 for this account 2026-07-09 and was still 404 on
    # 2026-08-15; swapped to the current-gen mid-size Nemotron, verified live.
    # Restore kimi if it ever comes back — it is listed in the catalog but not
    # served to this account, so listing it is not evidence it works.
    model: nvidia/nemotron-3-super-120b-a12b
    endpoint: https://integrate.api.nvidia.com/v1
    apiKeyEnv: NIM_API_KEY
    jobDescription: >
      Agentic, multi-step tool-use and automation (Nemotron 3 Super, 120B-a12b).
      Best for: designing and reasoning through automation workflows, multi-tool
      task plans, and scripting that needs dynamic decision-making. It is a
      reasoning model and spends tokens thinking before it answers, so give it
      room — a long task with a tight completion cap returns reasoning and no
      result. For plain code, prefer `coder`.

  - name: vision
    model: nvidia/nemotron-nano-12b-v2-vl
    endpoint: https://integrate.api.nvidia.com/v1
    apiKeyEnv: NIM_API_KEY
    jobDescription: >
      Looking at images (Nemotron Nano 12B v2 VL). Best for: describing
      screenshots, reading text off an image, document intelligence, and visual
      Q&A. This is what `claudbot screen` uses to describe captures — small and
      cheap on purpose, because it runs on a background heartbeat and must never
      touch the Claude plan. Call it with an image; it has no memory of prior
      calls.

  - name: longcontext
    # Same model as `coder`, and deliberately so. The undated
    # deepseek-v4-flash alias was retired with v4-pro on 2026-08-07; this dated
    # pin is the same weights and the only large-context model left on this
    # account. Two names for one endpoint is worth keeping — the roster is how
    # routing decisions get made, and collapsing the two roles into one name
    # would lose the distinction rather than record that it has narrowed.
    model: deepseek-ai/deepseek-v4-flash-0731
    endpoint: https://integrate.api.nvidia.com/v1
    apiKeyEnv: NIM_API_KEY
    jobDescription: >
      Large-context analysis (DeepSeek V4 Flash — 284B MoE, 1M-token context,
      fast). Best for: analyzing long documents, reviewing or sweeping large
      codebases, log/transcript analysis, and any task where the input is too
      big for the other agents.

  # ── OmniRoute gateway agents ────────────────────────────────────────────────
  #
  # These do not go to NVIDIA. They go to the local OmniRoute gateway on
  # loopback, which needs no API key (hence apiKeyEnv: null) and costs nothing.
  # `claudbot` starts the gateway itself if it is installed and not running.
  #
  # The gateway advertises 115 models. Do not trust that number — it is a
  # catalog, not an inventory. Probed model by model on 2026-08-27, 71 of the 73
  # concrete ids were unreachable and the failures were structural, not
  # transient:
  #
  #   aug/*   (28, incl. opus4.8 / sonnet5 / gpt5.6)  502 — OmniRoute shells out
  #           to an `auggie` CLI that is not installed on this machine.
  #   tllm/*  (26, incl. CLAUDE_4_6_SONNET, gemini_3_pro)  403 — "blocked by
  #           Vercel for this server egress IP"; needs a residential proxy.
  #   the rest  400/401/429 — rate-limited, retired, or never served here.
  #
  # Two answered then: oc/hy3-free and oc/nemotron-3-ultra-free, both through
  # the keyless `opencode` connection. On 2026-10-07 that went too — OpenCode
  # locked its free tier to its own client (403 "can only be used from within
  # OpenCode") and retired the rest (401 "not supported"), and since it was the
  # ONLY connection configured, every pool went dark at once.
  #
  # Hence `fallback:` on both entries: the gateway is the free path, never the
  # only one. Real pool members come from provider keys added in the OmniRoute
  # dashboard — see docs/orchestrator.md, "Making the gateway worth running".
  # Re-probe before adding an id here; a registry entry that 404s costs a call
  # and a retry before anything else can be tried.

  - name: gateway
    # The `claudbot` combo, not an OmniRoute auto/* pool: its members are only
    # models scripts/gateway-sync.mjs called and saw answer with a tool call.
    # Was auto/best-chat until every pool member died on 2026-10-07.
    model: claudbot
    endpoint: http://localhost:20128/v1
    apiKeyEnv: null
    fallback: fast
    jobDescription: >
      Free general-purpose chat and text work through the local OmniRoute
      gateway. Best for: summaries, drafting, classification, extraction,
      rewriting, and ordinary questions. Prefer this over `fast` whenever the
      gateway is up — it is the same class of work at no cost. It has no
      filesystem, no web and no memory between calls, so pass full context.

  - name: gateway-ultra
    # Same combo as `gateway` for now — no free reasoning-grade model is
    # verified yet. Its value today is the fallback to `researcher`; point it
    # at a dedicated combo once a keyed provider gives a strong reasoner.
    model: claudbot
    endpoint: http://localhost:20128/v1
    apiKeyEnv: null
    fallback: researcher
    maxTokens: 8192
    jobDescription: >
      Free deep reasoning through the local OmniRoute gateway (Nemotron 3 Ultra,
      550B MoE). Best for: multi-step reasoning, planning, and trade-off
      analysis where depth beats speed. Same role as `researcher` at no cost —
      try this first and fall back to `researcher` if the gateway is down. No
      web access: live research belongs in Claude's own WebSearch.
